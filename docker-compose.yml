name: mahalla-sync

x-app: &app
  image: mahalla-sync:production
  restart: unless-stopped
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-mahalla_sync}
    POSTGRES_USER: ${POSTGRES_USER:-mahalla}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mahalla_sync}
      POSTGRES_USER: ${POSTGRES_USER:-mahalla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    build:
      context: .
      target: production
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180 --graceful-timeout 180 --access-logfile -
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/mahallas/?page_size=1', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    stop_grace_period: 190s

  scheduler:
    <<: *app
    pull_policy: never
    command: ["python", "manage.py", "sync_mahallas", "--watch"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
