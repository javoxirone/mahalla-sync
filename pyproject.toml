[project]
name = "mahalla-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
